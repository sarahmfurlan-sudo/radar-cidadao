[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-cidadao-rpa"
version = "1.0.0"
description = "Prototipo CitizenTech RPA e IA para triagem de relatos de risco urbano"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
radar-rpa = "radar_rpa.cli:main"

[tool.setuptools.packages.find]
include = ["radar_rpa*"]
